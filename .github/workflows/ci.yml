name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go mod download all
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...
        env:
          GOPROXY: 'off'
      - run: go build ./cmd/yargitay-mcp
      - if: runner.os != 'Windows'
        run: test -z "$(gofmt -l cmd internal scripts)"
      - if: runner.os == 'Linux'
        run: sh -n scripts/install.sh && sh -n scripts/release.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install.sh scripts/release.sh
  npm-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sh scripts/release.sh "v$(node -p 'require("./package.json").version')"
      - run: npm pack --json --pack-destination dist > dist/npm-pack.json
      - run: npm run verify:pack
      - run: node npm/scripts/verify-publish.mjs "v$(node -p 'require("./package.json").version')" dist
      - run: npm run test:pack
